[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optopsy-delta-india"
version = "0.1.0"
description = "Read-only Delta Exchange India BTC/ETH options data adapter for unmodified Optopsy 2.3.0"
requires-python = ">=3.12,<3.14"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["requests>=2.31,<3", "pandas>=2,<3"]

[project.optional-dependencies]
research = ["optopsy==2.3.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
optopsy-delta = "optopsy_delta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
